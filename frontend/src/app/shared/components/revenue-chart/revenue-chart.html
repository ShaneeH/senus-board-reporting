<section class="chart-section">

    <div class="chart-header">

        <div>

            <span class="chart-eyebrow">
                Historical Performance
            </span>

            <h2>
                Revenue Trend
            </h2>

            <p>
                Revenue across all available reporting periods.
            </p>

        </div>

    </div>

    <div class="chart-container">

        <canvas
            baseChart
            type="line"
            [data]="chartData"
            [options]="chartOptions">
        </canvas>

    </div>

</section>
